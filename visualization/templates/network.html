<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skill Co-occurrence Network</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

  <div id="controls">
    <h3>Skill Co-occurrence Network</h3>
    <p id="status">Loading data...</p>
    
    <div class="slider-group">
      <label for="jaccard-slider">Min Jaccard Threshold: <span id="jaccard-val">0.00</span></label>
      <input type="range" id="jaccard-slider" min="0" max="0.5" step="0.02" value="0.00">
    </div>

    <div class="slider-group">
      <label for="spacing-slider">Node Spacing: <span id="spacing-val">250</span></label>
      <input type="range" id="spacing-slider" min="100" max="1000" step="50" value="250">
    </div>
  </div>

  <a id="source-card" href="{{ base_url }}" target="_blank" rel="noopener noreferrer">
    <div class="card-icon">🌐</div>
    <div class="card-info">
      <span class="card-title">Data Source</span>
      <span class="card-sub">Visit Scraped Site &rarr;</span>
    </div>
  </a>

  <div id="tooltip"></div>
  <svg id="network-svg"></svg>

  <script src="{{ url_for('static', filename='js/network.js') }}"></script>
</body>
</html>
