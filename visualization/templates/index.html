<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="static/jobs-skills.css">
</head>
<body>

  <h1 id="page-descrip">{{ descrip }}</h1>

  <div id="controls">
    <h3>Skill Network</h3>
    <p id="status">Loading graph data...</p>

    <div class="slider-group">
      <label for="charge-slider">Node spacing</label>
      <input type="range" id="charge-slider" min="50" max="1000" step="10" value="800">
    </div>
  </div>

  <div class="thumbnail-container">
    <a href="{{ listing_page }}" class="thumbnail-link" target="_blank" rel="noopener">
      <div class="thumbnail-image">
        <svg viewBox="0 0 64 64" width="48" height="48" aria-hidden="true">
          <rect x="6" y="10" width="52" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
          <line x1="6" y1="20" x2="58" y2="20" stroke="currentColor" stroke-width="3"/>
          <circle cx="14" cy="15" r="1.5" fill="currentColor"/>
          <circle cx="20" cy="15" r="1.5" fill="currentColor"/>
        </svg>
      </div>
      <div class="thumbnail-text">
        <span class="thumbnail-title">Source Listings</span>
        <span class="thumbnail-desc">View the original job postings this network was built from</span>
      </div>
    </a>
  </div>

  <svg id="network-svg"></svg>

  <script src="static/jobs-skills.js"></script>
</body>
</html>
